server {
    listen 80;
    server_name www.recftu.io.vn;
    return 301 https://recftu.io.vn$request_uri;
}

server {
    listen 80 default_server;
    server_name recftu.io.vn _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.[a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9][a-f0-9]\.(js|css|avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
